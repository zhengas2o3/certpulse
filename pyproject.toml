[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certpulse"
version = "0.1.0"
description = "Check TLS certificate expiry for many hosts at once, with monitoring-friendly exit codes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["tls", "ssl", "certificate", "expiry", "monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: System :: Monitoring",
]

[project.scripts]
certpulse = "certpulse.cli:main"

[tool.setuptools]
packages = ["certpulse"]
